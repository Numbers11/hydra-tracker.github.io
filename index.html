<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Hydra — Fluid Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a1628;
    --bg-card: #111e36;
    --bg-card-hover: #162847;
    --border: #1e3355;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --accent-water: #38bdf8;
    --accent-water-dim: #0c4a6e;
    --accent-toilet: #f0abfc;
    --accent-toilet-dim: #581c87;
    --accent-green: #4ade80;
    --danger: #f87171;
    --radius: 14px;
    --font: 'DM Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 100px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 20px;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .drop {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent-water), #818cf8);
    border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-nav button {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    display: grid;
    place-items: center;
    transition: background 0.15s;
  }
  .date-nav button:hover { background: var(--bg-card-hover); }
  .date-nav button:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .date-label {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text-dim);
    min-width: 100px;
    text-align: center;
  }

  /* Summary strip */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .summary-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .summary-card.water::after { background: linear-gradient(90deg, var(--accent-water), #818cf8); }
  .summary-card.toilet::after { background: linear-gradient(90deg, var(--accent-toilet), #f472b6); }
  .summary-card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .summary-card .value {
    font-family: var(--mono);
    font-size: 1.6rem;
    font-weight: 500;
  }
  .summary-card .unit {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-family: var(--font);
  }
  .summary-card.water .value { color: var(--accent-water); }
  .summary-card.toilet .value { color: var(--accent-toilet); }

  /* Chart */
  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }
  .chart-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 100px;
  }
  .chart-bar-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .chart-bars {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    width: 100%;
    height: 80px;
  }
  .chart-bar {
    flex: 1;
    border-radius: 4px 4px 2px 2px;
    min-height: 2px;
    transition: height 0.3s ease;
  }
  .chart-bar.water { background: linear-gradient(to top, var(--accent-water-dim), var(--accent-water)); }
  .chart-bar.toilet { background: linear-gradient(to top, var(--accent-toilet-dim), var(--accent-toilet)); }
  .chart-hour {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--text-dim);
    height: 1em;
    line-height: 1em;
  }

  /* Quick add buttons */
  .quick-add {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .quick-btn {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .quick-btn:active {
    transform: scale(0.97);
  }
  .quick-btn.water:hover, .quick-btn.water:active {
    border-color: var(--accent-water);
    background: var(--accent-water-dim);
  }
  .quick-btn.toilet:hover, .quick-btn.toilet:active {
    border-color: var(--accent-toilet);
    background: var(--accent-toilet-dim);
  }
  .quick-btn .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .quick-btn .btn-label {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
  }

  /* Volume picker modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    place-items: end center;
  }
  .modal-overlay.open { display: grid; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
  }
  .volume-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .preset-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: var(--font);
  }
  .preset-btn:hover, .preset-btn.selected {
    border-color: var(--accent-water);
    background: var(--accent-water-dim);
  }
  .preset-btn .vol {
    font-family: var(--mono);
    font-size: 1.2rem;
    font-weight: 500;
    display: block;
  }
  .preset-btn .desc {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .custom-vol {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
  }
  .custom-vol input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 1rem;
    outline: none;
  }
  .custom-vol input:focus { border-color: var(--accent-water); }
  .custom-vol span { color: var(--text-dim); font-size: 0.85rem; }

  /* Beverage type selector */
  .beverage-selector {
    margin-bottom: 16px;
  }
  .beverage-selector .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .beverage-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .bev-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: var(--font);
    transition: all 0.15s;
  }
  .bev-btn:hover, .bev-btn.selected {
    border-color: var(--accent-water);
    background: var(--accent-water-dim);
  }

  /* Toilet type */
  .toilet-type {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .toilet-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    font-family: var(--font);
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .toilet-btn:hover, .toilet-btn.selected {
    border-color: var(--accent-toilet);
    background: var(--accent-toilet-dim);
  }

  .modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .modal-btn {
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: var(--font);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn.cancel {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .modal-btn.confirm {
    background: var(--accent-water);
    color: var(--bg);
  }
  .modal-btn.confirm.toilet-confirm {
    background: var(--accent-toilet);
  }

  /* Entry log */
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .log-header h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .entry {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .entry .icon-dot {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .entry.water .icon-dot { background: var(--accent-water-dim); }
  .entry.toilet .icon-dot { background: var(--accent-toilet-dim); }
  .entry .details { flex: 1; }
  .entry .details .main {
    font-size: 0.9rem;
    font-weight: 500;
  }
  .entry .details .sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .entry .time {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .entry .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    font-size: 1rem;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  .entry .delete-btn:hover { opacity: 1; color: var(--danger); }

  /* Export bar */
  .export-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .export-btn {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .export-btn:hover {
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .empty-state .big-icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* Day tags */
  .day-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .day-tag {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 1.05rem;
    line-height: 1;
    cursor: default;
    animation: fadeIn 0.2s ease;
  }
  .tag-add-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 1rem;
    transition: all 0.15s;
  }
  .tag-add-btn:hover {
    border-color: var(--accent-water);
    color: var(--accent-water);
  }

  /* Tag modal */
  .tag-section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 16px;
  }
  .tag-section-label:first-child { margin-top: 0; }
  .tag-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag-pick-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 1.3rem;
    transition: all 0.15s;
  }
  .tag-pick-btn:hover { border-color: var(--accent-water); background: var(--accent-water-dim); }
  .tag-pick-btn.active {
    border-color: var(--accent-water);
    background: var(--accent-water-dim);
    box-shadow: 0 0 0 2px var(--accent-water);
  }
  .tag-custom-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 16px;
    margin-bottom: 20px;
  }
  .tag-custom-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 1.2rem;
    outline: none;
    text-align: center;
  }
  .tag-custom-row input:focus { border-color: var(--accent-water); }
  .tag-custom-row button {
    background: var(--accent-water);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    color: var(--bg);
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent-green);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 500;
    font-size: 0.85rem;
    z-index: 200;
    transition: transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><div class="drop"></div> Hydra</h1>
    <div class="date-nav">
      <button onclick="changeDate(-1)">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button id="nextDayBtn" onclick="changeDate(1)">›</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card water">
      <div class="label">Intake</div>
      <div><span class="value" id="totalIntake">0</span> <span class="unit">ml</span></div>
    </div>
    <div class="summary-card toilet">
      <div class="label">Bathroom</div>
      <div><span class="value" id="totalToilet">0</span> <span class="unit">visits</span></div>
    </div>
  </div>

  <div class="day-tags" id="dayTags"></div>

  <div class="chart-container">
    <div class="chart-title">Hourly breakdown</div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="quick-add">
    <button class="quick-btn water" onclick="openWaterModal()">
      <div class="icon">💧</div>
      <div class="btn-label">Log Drink</div>
    </button>
    <button class="quick-btn toilet" onclick="openToiletModal()">
      <div class="icon">🚻</div>
      <div class="btn-label">Log Bathroom</div>
    </button>
  </div>

  <div class="export-bar">
    <button class="export-btn" onclick="exportCSV()">Export CSV</button>
    <button class="export-btn" onclick="exportJSON()">Export JSON</button>
    <button class="export-btn" onclick="exportAllCSV()">Export All (CSV)</button>
  </div>

  <div class="log-header">
    <h2>Today's Log</h2>
  </div>
  <div id="logEntries"></div>
</div>

<!-- Water Modal -->
<div class="modal-overlay" id="waterModal">
  <div class="modal">
    <h2>💧 Log a Drink</h2>
    <div class="volume-presets" id="volumePresets">
      <button class="preset-btn" data-vol="150"><span class="vol">150</span><span class="desc">Small glass</span></button>
      <button class="preset-btn selected" data-vol="250"><span class="vol">250</span><span class="desc">Glass</span></button>
      <button class="preset-btn" data-vol="330"><span class="vol">330</span><span class="desc">Can</span></button>
      <button class="preset-btn" data-vol="500"><span class="vol">500</span><span class="desc">Bottle</span></button>
      <button class="preset-btn" data-vol="750"><span class="vol">750</span><span class="desc">Large</span></button>
      <button class="preset-btn" data-vol="1000"><span class="vol">1000</span><span class="desc">1 Litre</span></button>
    </div>
    <div class="custom-vol">
      <input type="number" id="customVol" placeholder="Custom" min="1" max="5000">
      <span>ml</span>
    </div>
    <div class="beverage-selector">
      <div class="label">Beverage</div>
      <div class="beverage-options" id="bevOptions">
        <button class="bev-btn selected" data-bev="Water">Water</button>
        <button class="bev-btn" data-bev="Tea">Tea</button>
        <button class="bev-btn" data-bev="Coffee">Coffee</button>
        <button class="bev-btn" data-bev="Juice">Juice</button>
        <button class="bev-btn" data-bev="Soda">Soda</button>
        <button class="bev-btn" data-bev="Beer">Beer</button>
        <button class="bev-btn" data-bev="Other">Other</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModals()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmWater()">Log Drink</button>
    </div>
  </div>
</div>

<!-- Toilet Modal -->
<div class="modal-overlay" id="toiletModal">
  <div class="modal">
    <h2>🚻 Log Bathroom Visit</h2>
    <div class="toilet-type" id="toiletType">
      <button class="toilet-btn selected" data-type="Urination">💦 Urination</button>
      <button class="toilet-btn" data-type="Bowel movement">💩 Bowel</button>
      <button class="toilet-btn" data-type="Both">Both</button>
      <button class="toilet-btn" data-type="Urgent">⚡ Urgent</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModals()">Cancel</button>
      <button class="modal-btn confirm toilet-confirm" onclick="confirmToilet()">Log Visit</button>
    </div>
  </div>
</div>

<!-- Tag Modal -->
<div class="modal-overlay" id="tagModal">
  <div class="modal">
    <h2>🏷️ Day Tags</h2>
    <div class="tag-section-label">Quick pick</div>
    <div class="tag-grid" id="tagQuickPicks"></div>
    <div id="tagRecentSection"></div>
    <div class="tag-section-label">Custom emoji</div>
    <div class="tag-custom-row">
      <input type="text" id="tagCustomInput" placeholder="Type or pick emoji" maxlength="2">
      <button onclick="addCustomTag()">Add</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModals()" style="grid-column:1/-1">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --- DB ---
  const DB_NAME = 'hydra-tracker';
  const DB_VERSION = 1;
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('entries')) {
          const store = d.createObjectStore('entries', { keyPath: 'id', autoIncrement: true });
          store.createIndex('date', 'date');
          store.createIndex('type', 'type');
        }
      };
      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = e => reject(e);
    });
  }

  function addEntry(entry) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('entries', 'readwrite');
      const store = tx.objectStore('entries');
      const now = new Date();
      entry.timestamp = now.toISOString();
      entry.date = now.toISOString().slice(0, 10); // always use actual current date
      const req = store.add(entry);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }

  function deleteEntry(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('entries', 'readwrite');
      tx.objectStore('entries').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e);
    });
  }

  function getEntriesByDate(dateStr) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('entries', 'readonly');
      const idx = tx.objectStore('entries').index('date');
      const req = idx.getAll(dateStr);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }

  function getAllEntries() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('entries', 'readonly');
      const req = tx.objectStore('entries').getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }

  // --- Date ---
  let currentDate = new Date();

  function currentDateStr() {
    return currentDate.toISOString().slice(0, 10);
  }

  function changeDate(delta) {
    const next = new Date(currentDate);
    next.setDate(next.getDate() + delta);
    const today = new Date();
    today.setHours(23,59,59,999);
    if (next > today) return; // prevent navigating to future dates
    currentDate = next;
    updateAll();
  }

  function formatDate(d) {
    const today = new Date();
    const t = new Date(d);
    today.setHours(0,0,0,0);
    t.setHours(0,0,0,0);
    const diff = (today - t) / 86400000;
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff === -1) return 'Tomorrow';
    return t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  // --- UI ---
  let selectedVol = 250;
  let selectedBev = 'Water';
  let selectedToiletType = 'Urination';

  function openWaterModal() {
    document.getElementById('waterModal').classList.add('open');
  }
  function openToiletModal() {
    document.getElementById('toiletModal').classList.add('open');
  }
  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
  }

  // Volume presets
  document.getElementById('volumePresets').addEventListener('click', e => {
    const btn = e.target.closest('.preset-btn');
    if (!btn) return;
    document.querySelectorAll('#volumePresets .preset-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedVol = parseInt(btn.dataset.vol);
    document.getElementById('customVol').value = '';
  });

  document.getElementById('customVol').addEventListener('input', e => {
    if (e.target.value) {
      selectedVol = parseInt(e.target.value) || 250;
      document.querySelectorAll('#volumePresets .preset-btn').forEach(b => b.classList.remove('selected'));
    }
  });

  // Beverage selector
  document.getElementById('bevOptions').addEventListener('click', e => {
    const btn = e.target.closest('.bev-btn');
    if (!btn) return;
    document.querySelectorAll('#bevOptions .bev-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedBev = btn.dataset.bev;
  });

  // Toilet type
  document.getElementById('toiletType').addEventListener('click', e => {
    const btn = e.target.closest('.toilet-btn');
    if (!btn) return;
    document.querySelectorAll('#toiletType .toilet-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedToiletType = btn.dataset.type;
  });

  // Close modals on overlay click (also handles tagModal)
  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) closeModals(); });
  });

  async function confirmWater() {
    await addEntry({ type: 'water', volume: selectedVol, beverage: selectedBev });
    closeModals();
    currentDate = new Date(); // switch view to today where the entry was logged
    showToast(`Logged ${selectedVol} ml ${selectedBev}`);
    updateAll();
  }

  async function confirmToilet() {
    await addEntry({ type: 'toilet', subtype: selectedToiletType });
    closeModals();
    currentDate = new Date(); // switch view to today where the entry was logged
    showToast(`Logged bathroom visit`);
    updateAll();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function isToday(d) {
    const today = new Date();
    return d.getFullYear() === today.getFullYear() &&
           d.getMonth() === today.getMonth() &&
           d.getDate() === today.getDate();
  }

  async function updateAll() {
    document.getElementById('dateLabel').textContent = formatDate(currentDate);
    document.getElementById('nextDayBtn').disabled = isToday(currentDate);
    const entries = await getEntriesByDate(currentDateStr());

    // Summary
    const totalMl = entries.filter(e => e.type === 'water').reduce((s, e) => s + e.volume, 0);
    const toiletCount = entries.filter(e => e.type === 'toilet').length;
    document.getElementById('totalIntake').textContent = totalMl;
    document.getElementById('totalToilet').textContent = toiletCount;

    // Tags
    renderDayTags();

    // Chart
    renderChart(entries);

    // Log
    renderLog(entries);
  }

  function renderChart(entries) {
    const container = document.getElementById('chart');
    const hours = Array.from({ length: 24 }, (_, i) => i);
    const waterByHour = new Array(24).fill(0);
    const toiletByHour = new Array(24).fill(0);

    entries.forEach(e => {
      const h = new Date(e.timestamp).getHours();
      if (e.type === 'water') waterByHour[h] += e.volume;
      else toiletByHour[h]++;
    });

    const maxW = Math.max(...waterByHour, 100);
    const maxT = Math.max(...toiletByHour, 1);

    // Show every 3rd hour label
    container.innerHTML = hours.map(h => {
      const wPct = (waterByHour[h] / maxW) * 100;
      const tPct = (toiletByHour[h] / maxT) * 100;
      const showLabel = h % 3 === 0;
      return `
        <div class="chart-bar-group">
          <div class="chart-bars">
            <div class="chart-bar water" style="height:${wPct}%"></div>
            <div class="chart-bar toilet" style="height:${tPct}%"></div>
          </div>
          <div class="chart-hour">${showLabel ? String(h).padStart(2, '0') : ''}</div>
        </div>`;
    }).join('');
  }

  function renderLog(entries) {
    const container = document.getElementById('logEntries');
    const sorted = [...entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    if (sorted.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="big-icon">📋</div>No entries yet. Start tracking!</div>';
      return;
    }

    container.innerHTML = sorted.map(e => {
      const time = new Date(e.timestamp).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (e.type === 'water') {
        return `<div class="entry water">
          <div class="icon-dot">💧</div>
          <div class="details">
            <div class="main">${e.volume} ml</div>
            <div class="sub">${e.beverage}</div>
          </div>
          <div class="time">${time}</div>
          <button class="delete-btn" onclick="removeEntry(${e.id})">×</button>
        </div>`;
      } else {
        return `<div class="entry toilet">
          <div class="icon-dot">🚻</div>
          <div class="details">
            <div class="main">${e.subtype}</div>
            <div class="sub">Bathroom visit</div>
          </div>
          <div class="time">${time}</div>
          <button class="delete-btn" onclick="removeEntry(${e.id})">×</button>
        </div>`;
      }
    }).join('');
  }

  async function removeEntry(id) {
    await deleteEntry(id);
    updateAll();
  }

  // --- Export ---
  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast(`Downloaded ${filename}`);
  }

  async function exportCSV() {
    const entries = await getEntriesByDate(currentDateStr());
    const csv = entriesToCSV(entries);
    downloadFile(`hydra-${currentDateStr()}.csv`, csv, 'text/csv');
  }

  async function exportAllCSV() {
    const entries = await getAllEntries();
    const csv = entriesToCSV(entries);
    downloadFile(`hydra-all-${currentDateStr()}.csv`, csv, 'text/csv');
  }

  function entriesToCSV(entries) {
    const header = 'date,time,type,subtype,volume_ml,beverage\n';
    const rows = entries.map(e => {
      const dt = new Date(e.timestamp);
      const date = dt.toISOString().slice(0, 10);
      const time = dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return `${date},${time},${e.type},${e.subtype || ''},${e.volume || ''},${e.beverage || ''}`;
    }).join('\n');
    return header + rows;
  }

  async function exportJSON() {
    const entries = await getEntriesByDate(currentDateStr());
    downloadFile(`hydra-${currentDateStr()}.json`, JSON.stringify(entries, null, 2), 'application/json');
  }

  // --- Tags (localStorage) ---
  const STANDARD_TAGS = ['❤️', '🏃', '🏋️', '🍺', '😊', '😢', '🍃'];
  const TAGS_STORAGE_KEY = 'hydra-tags';
  const RECENT_TAGS_KEY = 'hydra-recent-tags';

  function getAllTags() {
    try { return JSON.parse(localStorage.getItem(TAGS_STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function getTagsForDate(dateStr) {
    return getAllTags()[dateStr] || [];
  }

  function setTagsForDate(dateStr, tags) {
    const all = getAllTags();
    if (tags.length === 0) delete all[dateStr];
    else all[dateStr] = tags;
    localStorage.setItem(TAGS_STORAGE_KEY, JSON.stringify(all));
  }

  function getRecentTags() {
    try { return JSON.parse(localStorage.getItem(RECENT_TAGS_KEY)) || []; }
    catch { return []; }
  }

  function addRecentTag(emoji) {
    let recent = getRecentTags().filter(t => t !== emoji);
    recent.unshift(emoji);
    recent = recent.slice(0, 3);
    localStorage.setItem(RECENT_TAGS_KEY, JSON.stringify(recent));
  }

  function toggleTag(dateStr, emoji) {
    const tags = getTagsForDate(dateStr);
    const idx = tags.indexOf(emoji);
    if (idx >= 0) {
      tags.splice(idx, 1);
    } else {
      tags.push(emoji);
      addRecentTag(emoji);
    }
    setTagsForDate(dateStr, tags);
    renderDayTags();
    renderTagModal();
  }

  function addCustomTag() {
    const input = document.getElementById('tagCustomInput');
    const val = input.value.trim();
    if (!val) return;
    // Extract first emoji (could be multi-codepoint)
    const segments = [...new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(val)];
    if (segments.length === 0) return;
    const emoji = segments[0].segment;
    // Verify it's likely an emoji (not a plain letter/number)
    if (/^[a-zA-Z0-9\s]$/.test(emoji)) {
      showToast('Please enter an emoji');
      return;
    }
    toggleTag(currentDateStr(), emoji);
    input.value = '';
  }

  function renderDayTags() {
    const container = document.getElementById('dayTags');
    const tags = getTagsForDate(currentDateStr());
    const pills = tags.map(t => `<span class="day-tag">${t}</span>`).join('');
    container.innerHTML = pills + `<button class="tag-add-btn" onclick="openTagModal()">+</button>`;
  }

  function openTagModal() {
    renderTagModal();
    document.getElementById('tagModal').classList.add('open');
  }

  function renderTagModal() {
    const dateStr = currentDateStr();
    const activeTags = getTagsForDate(dateStr);
    const recent = getRecentTags().filter(t => !STANDARD_TAGS.includes(t));

    // Quick picks
    const quickContainer = document.getElementById('tagQuickPicks');
    quickContainer.innerHTML = STANDARD_TAGS.map(e =>
      `<button class="tag-pick-btn ${activeTags.includes(e) ? 'active' : ''}" onclick="toggleTag('${dateStr}','${e}')">${e}</button>`
    ).join('');

    // Recent section
    const recentSection = document.getElementById('tagRecentSection');
    if (recent.length > 0) {
      recentSection.innerHTML = `
        <div class="tag-section-label">Recent</div>
        <div class="tag-grid">${recent.map(e =>
          `<button class="tag-pick-btn ${activeTags.includes(e) ? 'active' : ''}" onclick="toggleTag('${dateStr}','${e}')">${e}</button>`
        ).join('')}</div>`;
    } else {
      recentSection.innerHTML = '';
    }
  }

  // --- Init ---
  openDB().then(() => updateAll());

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
